name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like fz-maximize to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / what's your setup?
      description: Monitors, FancyZones layouts, workflow.

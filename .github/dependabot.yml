# Dependabot version updates. (Security updates and alerts are enabled in the repo
# settings and open PRs as soon as an advisory affects a dependency.)
#
# Each ecosystem waits 7 days after a release before proposing it (cooldown), so a
# hijacked or broken version is usually caught and yanked before it reaches us. The
# cooldown applies to version updates only; security updates still arrive right away.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      # One PR per week for all compatible (minor/patch) crate updates.
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # The website (site/, Astro Starlight). Not shipped with the app.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: site
    groups:
      site-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      # Actions are pinned to commit SHAs; Dependabot bumps the SHA and version comment.
      github-actions:
        patterns: ["*"]

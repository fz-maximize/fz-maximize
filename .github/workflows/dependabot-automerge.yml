# Approves and auto-merges low-risk Dependabot PRs. GitHub only merges once every
# required check passes (CI `check`, the CodeQL gate) and the PR is up to date with main.
#
# Auto-merged:
#   * Website npm packages (site/): any update. They don't ship with the app.
#   * Rust crates and GitHub Actions: patch and minor updates (security updates too).
# Left for a person:
#   * Major version updates of crates and Actions.
#   * Any update where the package's maintainers changed.
#   * Anything a person pushed to the Dependabot branch (the actor is no longer Dependabot).
#
# The approval comes from the fz-maximize-automerge GitHub App (installed on this repo only,
# with Contents and Pull requests write). Its credentials are Dependabot secrets, which only
# Dependabot-triggered runs can read. The app then enables auto-merge, so the merge is the
# app's and the push to main triggers the usual workflows (a GITHUB_TOKEN merge wouldn't).
name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  automerge:
    if: >-
      github.repository == 'fz-maximize/fz-maximize' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - id: decide
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DIRECTORY: ${{ steps.meta.outputs.directory }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          MAINTAINER_CHANGES: ${{ steps.meta.outputs.maintainer-changes }}
        run: |
          echo "ecosystem=$ECOSYSTEM directory=$DIRECTORY update=$UPDATE_TYPE maintainer-changes=$MAINTAINER_CHANGES"
          merge=false
          if [[ "$MAINTAINER_CHANGES" == "true" ]]; then
            echo "Maintainers changed: leaving this one for review."
          elif [[ "$ECOSYSTEM" == "npm_and_yarn" && "$DIRECTORY" == "/site" ]]; then
            merge=true
          elif [[ "$ECOSYSTEM" == "cargo" || "$ECOSYSTEM" == "github_actions" ]]; then
            case "$UPDATE_TYPE" in
              version-update:semver-patch|version-update:semver-minor) merge=true ;;
              *) echo "$UPDATE_TYPE: leaving this one for review." ;;
            esac
          else
            echo "Not covered by the auto-merge policy: leaving this one for review."
          fi
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - id: token
        if: steps.decide.outputs.merge == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and enable auto-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve --body "Auto-approved: within the Dependabot auto-merge policy (.github/workflows/dependabot-automerge.yml)." "$PR_URL"
          gh pr merge --auto --rebase "$PR_URL"

# Build and publish a release.
#
# * Push a tag `vX.Y.Z` (matching `version` in Cargo.toml): builds, checks, packages,
#   attests provenance and publishes a GitHub Release with the installer, portable zip
#   and SHA-256 checksums. The release is created by github-actions, not a person.
# * Run manually (Actions → Release → Run workflow): builds and uploads the files as a
#   workflow artifact only, without publishing anything. Useful to test the pipeline.
#
# Code signing (SignPath Foundation) slots in at the marked step once approved.
#
# ARM64 is cross-compiled on the x64 runner (its Visual Studio has the ARM64 build tools),
# then smoke-tested on a real Windows on ARM runner before anything is published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $v (expected v$v)."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: fmt + clippy + unit tests
        run: task check

      - name: Build installers and portable zips (x64 + ARM64)
        run: task package

      # --- Code signing goes here (SignPath Foundation, once the project is approved). ---

      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          }
          # LF line endings so `sha256sum -c SHA256SUMS.txt` works on Linux/macOS/Git Bash.
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fz-maximize-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  arm64-smoke:
    needs: build
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fz-maximize-${{ needs.build.outputs.version }}
          path: dist

      - name: Run the ARM64 build natively
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $zip = "dist/fz-maximize-$env:VERSION-arm64-portable.zip"
          tar -xf $zip -C $env:RUNNER_TEMP
          $exe = Join-Path $env:RUNNER_TEMP "fz-maximize.exe"
          # PE machine type must be ARM64 (0xAA64), not x64 running under emulation.
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0xAA64) { throw ("not an ARM64 binary: machine 0x{0:X4}" -f $machine) }
          $out = & $exe --version
          Write-Host $out
          if ($out -ne "fz-maximize $env:VERSION") { throw "unexpected --version output: $out" }
          # The ARM64 installer is an ARM64-only Inno Setup build; check it is present.
          if (-not (Test-Path "dist/fz-maximize-$env:VERSION-arm64-setup.exe")) { throw "ARM64 installer missing" }

  publish:
    needs: [build, arm64-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fz-maximize-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## Install"
            echo
            echo "Download the installer for your PC and run it:"
            echo
            echo "* **fz-maximize-${VERSION}-x64-setup.exe**: most PCs (Intel and AMD)."
            echo "* **fz-maximize-${VERSION}-arm64-setup.exe**: Windows on ARM (Snapdragon, e.g. Copilot+ PCs)."
            echo
            echo "Not sure? Settings > System > About > System type. Either installs for the current user (no admin rights needed) and can start with Windows."
            echo "Requires Windows 10/11 with PowerToys FancyZones enabled."
            echo
            echo "Portable builds (just the exe): **fz-maximize-${VERSION}-x64-portable.zip** and **fz-maximize-${VERSION}-arm64-portable.zip**."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Build provenance: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
          } > notes.md
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "fz-maximize ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"

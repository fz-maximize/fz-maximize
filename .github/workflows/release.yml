# Build and publish a release.
#
# * Push a tag `vX.Y.Z` (matching `version` in Cargo.toml): builds, checks, packages,
#   attests provenance and publishes a GitHub Release with the installer, portable zip
#   and SHA-256 checksums. The release is created by github-actions, not a person.
# * Run manually (Actions → Release → Run workflow): builds and uploads the files as a
#   workflow artifact only, without publishing anything. Useful to test the pipeline.
#
# Code signing (SignPath Foundation) slots in at the marked step once approved.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # build provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages[0].version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $v (expected v$v)."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: fmt + clippy + unit tests
        run: task check

      - name: Build installer and portable zip
        run: task package

      # --- Code signing goes here (SignPath Foundation, once the project is approved). ---

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fz-maximize-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fz-maximize-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "## Install"
            echo
            echo "Download **fz-maximize-${VERSION}-x64-setup.exe** and run it. It installs for the current user (no admin rights needed) and can start with Windows."
            echo "Requires Windows 10/11 with PowerToys FancyZones enabled."
            echo
            echo "A portable build (just the exe) is in **fz-maximize-${VERSION}-x64-portable.zip**."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Build provenance: \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`"
          } > notes.md
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "fz-maximize ${VERSION}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"

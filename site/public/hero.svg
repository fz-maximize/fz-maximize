<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 372" role="img" aria-labelledby="t">
  <title id="t">A window on an ultrawide monitor with three FancyZones zones. Clicking maximize fills the middle zone; clicking again restores it.</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a4f"/>
      <stop offset="0.55" stop-color="#11589f"/>
      <stop offset="1" stop-color="#3b8fd9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Monitor -->
  <path d="M396 304 L444 304 L456 344 L384 344 Z" fill="#2a2f37"/>
  <rect x="330" y="340" width="180" height="12" rx="6" fill="#2a2f37"/>
  <rect x="20" y="10" width="800" height="296" rx="16" fill="#15181d"/>
  <rect x="32" y="22" width="776" height="272" rx="6" fill="url(#wall)"/>
  <rect x="32" y="22" width="776" height="272" rx="6" fill="url(#glow)"/>

  <!-- FancyZones layout: 25% / 50% / 25% -->
  <g fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="42" y="32" width="184" height="252" rx="6"/>
    <rect x="236" y="32" width="368" height="252" rx="6"/>
    <rect x="614" y="32" width="184" height="252" rx="6"/>
  </g>
  <!-- Zone highlight as the window snaps in -->
  <rect x="236" y="32" width="368" height="252" rx="6" fill="#7cc0ff" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      values="0;0;0.35;0;0" keyTimes="0;0.2;0.215;0.3;1"/>
  </rect>

  <!-- A window already snapped into the right zone -->
  <g filter="url(#shadow)">
    <rect x="614" y="32" width="184" height="252" rx="6" fill="#eef1f5"/>
  </g>
  <rect x="614" y="58" width="184" height="1" fill="#d3d9e1"/>
  <rect x="624" y="41" width="8" height="8" rx="2" fill="#2f9e6e"/>
  <rect x="638" y="42" width="52" height="6" rx="3" fill="#9aa4b1"/>
  <g fill="#cfd6df">
    <rect x="630" y="76" width="130" height="7" rx="3.5"/>
    <rect x="630" y="92" width="100" height="7" rx="3.5"/>
    <rect x="630" y="108" width="140" height="7" rx="3.5"/>
    <rect x="630" y="124" width="80" height="7" rx="3.5"/>
  </g>

  <!-- The window being maximized: its frame resizes, its content never stretches -->
  <g filter="url(#shadow)">
    <rect x="286" y="80" width="232" height="150" rx="6" fill="#f7f8fa">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="spline"
        values="286;286;236;236;286;286" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
        keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
      <animate attributeName="y" dur="6s" repeatCount="indefinite" calcMode="spline"
        values="80;80;32;32;80;80" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
        keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="spline"
        values="232;232;368;368;232;232" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
        keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
      <animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline"
        values="150;150;252;252;150;150" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
        keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
    </rect>
  </g>
  <rect x="286" y="106" width="232" height="1" fill="#d3d9e1">
    <animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="spline"
      values="286;286;236;236;286;286" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
      keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
    <animate attributeName="y" dur="6s" repeatCount="indefinite" calcMode="spline"
      values="106;106;58;58;106;106" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
      keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
    <animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="spline"
      values="232;232;368;368;232;232" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
      keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
  </rect>
  <!-- Content, anchored to the window's top-left corner -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="spline"
      values="286 80;286 80;236 32;236 32;286 80;286 80" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
      keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
    <rect x="10" y="9" width="8" height="8" rx="2" fill="#0078d4"/>
    <rect x="24" y="10" width="64" height="6" rx="3" fill="#9aa4b1"/>
    <g fill="#c9d1db">
      <rect x="16" y="44" width="150" height="7" rx="3.5"/>
      <rect x="16" y="60" width="118" height="7" rx="3.5"/>
      <rect x="16" y="76" width="176" height="7" rx="3.5"/>
      <rect x="16" y="92" width="92" height="7" rx="3.5"/>
      <rect x="16" y="108" width="140" height="7" rx="3.5"/>
    </g>
  </g>
  <!-- Caption buttons, anchored to the top-right corner -->
  <g fill="none" stroke="#5b6573" stroke-width="1.4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="spline"
      values="518 80;518 80;604 32;604 32;518 80;518 80" keyTimes="0;0.2;0.2417;0.7167;0.7583;1"
      keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.2 0.8 0.2 1;0 0 1 1"/>
    <path d="M-74 13 H-64"/>
    <rect x="-46" y="8.5" width="9" height="9" rx="1"/>
    <path d="M-22 8.5 L-13 17.5 M-13 8.5 L-22 17.5"/>
  </g>

  <!-- Click ripples on the maximize button -->
  <circle cx="477.5" cy="93" r="0" fill="none" stroke="#ffffff" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="6s" repeatCount="indefinite" values="0;0;4;18;18" keyTimes="0;0.199;0.2;0.26;1"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.199;0.2;0.26;1"/>
  </circle>
  <circle cx="563.5" cy="45" r="0" fill="none" stroke="#0078d4" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="6s" repeatCount="indefinite" values="0;0;4;18;18" keyTimes="0;0.716;0.7167;0.7767;1"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.716;0.7167;0.7767;1"/>
  </circle>

  <!-- Cursor (its tip is the origin) -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" calcMode="spline"
      values="430 250;430 250;477.5 93;477.5 93;563.5 45;563.5 45;430 250;430 250"
      keyTimes="0;0.0667;0.1833;0.55;0.6833;0.8;0.9667;1"
      keySplines="0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1;0.4 0 0.2 1;0 0 1 1"/>
    <path d="M0 0 L0 17 L4.5 13 L7.5 20 L10 19 L7 12 L13 12 Z" fill="#fff" stroke="#111" stroke-width="1" stroke-linejoin="round"/>
  </g>
</svg>
